name: Midnight Compact Compile & QA CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  compact-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Midnight Compact Compiler
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors --retry-delay 3 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Verify Compact Version & Compile LeaseProof Contract
        run: |
          compact update
          compact --version
          compact compile contracts/leaseproof.compact contracts/managed/leaseproof

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit & Adversarial ZK Tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Run Next.js Production Build
        run: npm run build
